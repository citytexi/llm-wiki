[pytest]
# 테스트 두 벌이 각자 다른 디렉토리의 모듈을 import한다. 여기서 경로를 주면
# 각 tests/ 아래 conftest.py가 sys.path를 손볼 필요가 없다.
#
# conftest.py는 패키지가 아니라 top-level 모듈로 적재된다. 두 벌 모두 자기
# conftest.py를 두면 이름이 겹쳐, 루트에서 한 번에 돌릴 때 먼저 잡힌 쪽이
# 다른 쪽 헬퍼를 가린다(`from conftest import page`가 엉뚱한 모듈에 붙는다).
# 그래서 conftest.py는 wiki/script/tests 한 곳에만 둔다.
pythonpath = wiki/script script
testpaths = wiki/script/tests script/tests
